name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev

  dsh-plugin:
    runs-on: ubuntu-latest
    env:
      DSH_COMMIT: 47f943859bef60e4160492346772ded9b24f765a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Checkout pinned DeepSeek Harness
        run: |
          DSH_SOURCE_DIR="${RUNNER_WORKSPACE}/deepseek-harness"
          git clone --filter=blob:none --no-checkout https://github.com/deepseek-ai/deepseek-harness.git "$DSH_SOURCE_DIR"
          git -C "$DSH_SOURCE_DIR" fetch --depth 1 origin "$DSH_COMMIT"
          git -C "$DSH_SOURCE_DIR" checkout --detach FETCH_HEAD
      - name: Install DeepSeek Harness dependencies
        run: corepack pnpm@11.7.0 --dir "${RUNNER_WORKSPACE}/deepseek-harness" install --frozen-lockfile
      - name: Build DeepSeek Harness libraries
        run: corepack pnpm@11.7.0 --dir "${RUNNER_WORKSPACE}/deepseek-harness" run build:lib
      - name: Install plugin dependencies
        run: corepack pnpm@11.7.0 --dir packages/dsh-plugin install --frozen-lockfile
      - run: corepack pnpm@11.7.0 --dir packages/dsh-plugin test
      - run: corepack pnpm@11.7.0 --dir packages/dsh-plugin typecheck
      - run: corepack pnpm@11.7.0 --dir packages/dsh-plugin build
      - run: corepack pnpm@11.7.0 --dir packages/dsh-plugin eval:resume-match
      - run: corepack pnpm@11.7.0 --dir packages/dsh-plugin audit --prod
